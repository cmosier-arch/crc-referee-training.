<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WVL 3rd/4th Grade — Defensive Rules</title>
<style>
:root{--blue:#2c3785;--gold:#fad606;--bg:#f5f7fb;--card:#fff;--muted:#5f6775;--border:#d8dce5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#20242b}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit}
.tab,.ctrl{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}
h2{margin:0;color:var(--blue);font-size:22px}
.desc{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.4}
.controls{display:flex;gap:8px}
.play{background:var(--gold);color:var(--blue);border-color:var(--gold)}
.banner{display:none;background:var(--gold);border:2px solid var(--blue);color:var(--blue);border-radius:10px;padding:12px 15px;margin-bottom:12px}
.banner strong{display:block;font-size:16px}
.banner span{font-size:14px;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.watch{margin-top:14px;background:white;border:2px solid var(--gold);border-radius:10px;padding:12px 14px}
.watch b{color:var(--blue);font-size:14px}
.watch div{margin-top:5px;font-size:14px;line-height:1.4}
@media(max-width:700px){.header{flex-direction:column}.controls{width:100%}.controls button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-s="dead">1 · Dead Ball / Made Basket</button>
    <button class="tab" data-s="reb">2 · Rebound / Live Change</button>
    <button class="tab" data-s="minute">3 · Last Minute</button>
    <button class="tab" data-s="twenty">4 · Lead of 20+</button>
  </div>

  <div class="header">
    <div>
      <h2 id="ttl"></h2>
      <div id="desc" class="desc"></div>
    </div>
    <div class="controls">
      <button id="play" class="ctrl play">▶ Play</button>
      <button id="reset" class="ctrl">↻ Restart</button>
    </div>
  </div>

  <div id="banner" class="banner">
    <strong id="bt"></strong>
    <span id="bx"></span>
  </div>

  <div class="card">
    <svg viewBox="0 0 920 520">
      <rect x="20" y="20" width="880" height="480" rx="4" fill="#fff" stroke="#2c3785" stroke-width="4"/>
      <line x1="460" y1="20" x2="460" y2="500" stroke="#2c3785" stroke-width="4"/>
      <circle cx="460" cy="260" r="60" fill="none" stroke="#2c3785" stroke-width="3" opacity=".35"/>
      <line x1="78" y1="210" x2="78" y2="310" stroke="#2c3785" stroke-width="7"/>
      <circle cx="97" cy="260" r="8" fill="none" stroke="#2c3785" stroke-width="4"/>
      <line x1="842" y1="210" x2="842" y2="310" stroke="#2c3785" stroke-width="7"/>
      <circle cx="823" cy="260" r="8" fill="none" stroke="#2c3785" stroke-width="4"/>
      <rect x="20" y="170" width="170" height="180" fill="none" stroke="#2c3785" stroke-width="2" opacity=".3"/>
      <rect x="730" y="170" width="170" height="180" fill="none" stroke="#2c3785" stroke-width="2" opacity=".3"/>
      <path id="leftArc" d="M245 72 A225 225 0 0 1 245 448" fill="none" stroke="#2c3785" stroke-width="3" opacity=".14"/>
      <path id="rightArc" d="M675 72 A225 225 0 0 0 675 448" fill="none" stroke="#2c3785" stroke-width="3" opacity=".08"/>

      <g id="half">
        <rect x="371" y="34" width="178" height="36" rx="7" fill="#fad606"/>
        <text x="460" y="58" text-anchor="middle" fill="#2c3785" font-size="14" font-weight="900">DO NOT CROSS YET</text>
      </g>

      <g id="arcLabel" opacity="0">
        <rect x="68" y="39" width="235" height="35" rx="7" fill="#fad606"/>
        <text x="185" y="62" text-anchor="middle" fill="#2c3785" font-size="14" font-weight="900">DEFENSE STAYS INSIDE ARC</text>
      </g>

      <g id="clock" opacity="0">
        <rect x="380" y="84" width="160" height="65" rx="9" fill="#2c3785"/>
        <text x="460" y="108" text-anchor="middle" fill="white" font-size="12" font-weight="700">2ND QUARTER</text>
        <text x="460" y="138" text-anchor="middle" fill="#fad606" font-size="28" font-weight="900">0:48</text>
      </g>

      <g id="inboundMark" opacity="0">
        <text x="870" y="335" text-anchor="middle" fill="#2c3785" font-size="13" font-weight="900">INBOUND</text>
        <path d="M850 345 L875 365" stroke="#2c3785" stroke-width="3"/>
      </g>

      <g id="people"></g>
      <circle id="ball" r="10" fill="#fad606" stroke="#2c3785" stroke-width="3"/>
    </svg>
  </div>

  <div class="watch">
    <b>WHAT THE OFFICIAL SHOULD WATCH</b>
    <div id="watch"></div>
  </div>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const g=document.getElementById('people'),ball=document.getElementById('ball'),
ttl=document.getElementById('ttl'),desc=document.getElementById('desc'),
watch=document.getElementById('watch'),banner=document.getElementById('banner'),
bt=document.getElementById('bt'),bx=document.getElementById('bx'),
clock=document.getElementById('clock'),half=document.getElementById('half'),
arcLabel=document.getElementById('arcLabel'),leftArc=document.getElementById('leftArc'),
inboundMark=document.getElementById('inboundMark'),play=document.getElementById('play'),
tabs=[...document.querySelectorAll('.tab')];

let scene='dead',nodes=[],raf=null,running=false;

function mk(team,i){
  const q=document.createElementNS(NS,'g');
  const c=document.createElementNS(NS,'circle');
  const t=document.createElementNS(NS,'text');
  c.setAttribute('r',18);
  c.setAttribute('fill',team==='O'?'#fad606':'#2c3785');
  c.setAttribute('stroke','#2c3785'); c.setAttribute('stroke-width',3);
  t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
  t.setAttribute('font-size',13); t.setAttribute('font-weight',900);
  t.setAttribute('fill',team==='O'?'#2c3785':'white'); t.textContent=team;
  q.append(c,t); g.append(q); nodes.push({q,team,i});
}
for(let i=0;i<5;i++)mk('O',i);
for(let i=0;i<5;i++)mk('D',i);

const S={
dead:{
 title:'Dead Ball / Made Basket',
 desc:'The defense is already set in normal half-court position. They do not need to move toward the ball while it is still in the backcourt.',
 watch:'Watch the half-court line. No defender may enter the backcourt before the ball crosses. Once the ball enters the frontcourt, the nearest defender can step up and guard — while staying on the frontcourt side.',
 dur:4600,
 O0:[[835,260],[875,335],[250,145],[245,390],[315,265]],
 O1:[[425,260],[505,330],[250,145],[245,390],[315,265]],
 D0:[[350,255],[330,360],[255,205],[270,435],[395,330]],
 D1:[[395,260],[330,360],[255,205],[270,435],[395,330]],
 B0:[835,280],B1:[425,280],guardStart:.78
},
reb:{
 title:'Defensive Rebound / Live Change of Possession',
 desc:'The rebounder may be defended immediately. The defense does not have to retreat after a live change of possession.',
 watch:'Immediate pressure after a defensive rebound or other live possession change is LEGAL. Play on.',
 dur:3900,
 O0:[[155,260],[210,120],[215,400],[275,185],[280,340]],
 O1:[[430,260],[600,120],[610,400],[680,185],[685,340]],
 D0:[[125,260],[190,150],[195,380],[250,210],[255,320]],
 D1:[[400,260],[570,150],[580,380],[650,210],[655,320]],
 B0:[125,280],B1:[400,280],ba:.32,
 btitle:'LEGAL — PLAY ON',btext:'The defender may immediately guard the rebounder.'
},
minute:{
 title:'Last Minute of Each Half',
 desc:'During the final minute, full-court pressure is legal — including on an inbound after a dead ball or made basket.',
 watch:'Under 1:00 in either half, defenders may pressure the inbounder, deny receivers and guard immediately in the backcourt.',
 dur:4100,
 O0:[[875,270],[815,215],[800,330],[735,175],[730,395]],
 O1:[[875,270],[660,225],[650,340],[585,175],[580,395]],
 D0:[[835,215],[790,330],[720,220],[700,365],[640,285]],
 D1:[[655,210],[615,330],[560,220],[545,365],[500,285]],
 B0:[875,292],B1:[665,245],ba:.12,
 btitle:'FULL-COURT PRESS IS LEGAL',btext:'Pressure may begin immediately on the inbound.'
},
twenty:{
 title:'Leading by 20 or More',
 desc:'When a 3rd/4th-grade team leads by 20+, the leading defense must retreat behind the 3-point line.',
 watch:'All five defenders on the leading team must keep both feet inside the 3-point line while defending, except for a loose ball or rebound.',
 dur:3800,
 O0:[[520,260],[580,120],[590,400],[650,185],[650,340]],
 O1:[[350,260],[500,120],[510,400],[560,185],[560,340]],
 D0:[[155,260],[150,120],[150,400],[215,185],[215,340]],
 D1:[[155,260],[150,120],[150,400],[215,185],[215,340]],
 B0:[520,280],B1:[350,280]
}};

function xy(q,p){q.setAttribute('transform',`translate(${p[0]} ${p[1]})`)}
function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function stop(){cancelAnimationFrame(raf);running=false;play.textContent='▶ Play'}
function setup(){
 const s=S[scene];
 nodes.forEach(n=>xy(n.q,(n.team==='O'?s.O0:s.D0)[n.i]));
 ball.setAttribute('cx',s.B0[0]);ball.setAttribute('cy',s.B0[1]);
 ttl.textContent=s.title;desc.textContent=s.desc;watch.textContent=s.watch;
 banner.style.display='none';
 clock.setAttribute('opacity',scene==='minute'?1:0);
 inboundMark.setAttribute('opacity',scene==='minute'?1:0);
 half.setAttribute('opacity',scene==='dead'?1:0);
 arcLabel.setAttribute('opacity',scene==='twenty'?1:0);
 leftArc.setAttribute('stroke',scene==='twenty'?'#fad606':'#2c3785');
 leftArc.setAttribute('stroke-width',scene==='twenty'?7:3);
 leftArc.setAttribute('opacity',scene==='twenty'?1:.14);
}
function run(){
 stop();setup();running=true;play.textContent='⏸ Pause';
 const s=S[scene],st=performance.now();
 function f(now){
  const t=Math.min(1,(now-st)/s.dur);
  const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  nodes.forEach(n=>{
    const a=(n.team==='O'?s.O0:s.D0)[n.i], b=(n.team==='O'?s.O1:s.D1)[n.i];
    let use=e;
    if(scene==='dead' && n.team==='D'){
      if(n.i===0){
        use=t<s.guardStart?0:(t-s.guardStart)/(1-s.guardStart);
      } else {
        use=0;
      }
    }
    xy(n.q,lerp(a,b,Math.max(0,Math.min(1,use))));
  });
  const p=lerp(s.B0,s.B1,e);
  ball.setAttribute('cx',p[0]);ball.setAttribute('cy',p[1]);
  if(s.ba&&t>s.ba){
    banner.style.display='block';bt.textContent=s.btitle;bx.textContent=s.btext;
  }
  if(t<1&&running)raf=requestAnimationFrame(f);
  else{running=false;play.textContent='▶ Play'}
 }
 raf=requestAnimationFrame(f);
}
function choose(s){
 stop();scene=s;
 tabs.forEach(b=>b.classList.toggle('active',b.dataset.s===s));
 setup();
}
tabs.forEach(b=>b.onclick=()=>choose(b.dataset.s));
play.onclick=()=>running?stop():run();
document.getElementById('reset').onclick=()=>{stop();setup()};
setup();
})();
</script>
</body>
</html>
