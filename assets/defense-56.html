<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WVL 5th/6th Grade — Defensive Rules</title>
<style>
:root{--blue:#2c3785;--gold:#fad606;--bg:#f5f7fb;--card:#fff;--muted:#606775;--border:#d8dce5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#20242b}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer}.tab,.ctrl{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 15px;font-weight:700}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}
h2{margin:0;color:var(--blue);font-size:22px}.desc{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.4}
.controls{display:flex;gap:8px}.play{background:var(--gold);color:var(--blue);border-color:var(--gold)}
.banner{background:var(--gold);border:2px solid var(--blue);color:var(--blue);border-radius:10px;padding:12px 15px;margin-bottom:12px}
.banner strong{display:block;font-size:17px}.banner span{font-size:14px;font-weight:700}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px;overflow:hidden}
svg{display:block;width:100%;height:auto}.watch{margin-top:14px;background:#fff;border:2px solid var(--gold);border-radius:10px;padding:12px 14px}
.watch b{color:var(--blue);font-size:14px}.watch div{margin-top:5px;font-size:14px;line-height:1.4}
@media(max-width:700px){.header{flex-direction:column}.controls{width:100%}.controls button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
 <div class="tabs">
  <button class="tab active" data-s="press">1 · Pressure Allowed at All Times</button>
  <button class="tab" data-s="twenty">2 · Lead of 20+</button>
 </div>
 <div class="header">
  <div><h2 id="ttl"></h2><div id="desc" class="desc"></div></div>
  <div class="controls"><button id="play" class="ctrl play">▶ Play</button><button id="reset" class="ctrl">↻ Restart</button></div>
 </div>
 <div class="banner"><strong id="bt"></strong><span id="bx"></span></div>
 <div class="card">
 <svg viewBox="0 0 920 520">
  <rect x="20" y="20" width="880" height="480" rx="4" fill="#fff" stroke="#2c3785" stroke-width="4"/>
  <line id="midline" x1="460" y1="20" x2="460" y2="500" stroke="#2c3785" stroke-width="4"/>
  <circle cx="460" cy="260" r="60" fill="none" stroke="#2c3785" stroke-width="3" opacity=".35"/>
  <line x1="78" y1="210" x2="78" y2="310" stroke="#2c3785" stroke-width="7"/><circle cx="97" cy="260" r="8" fill="none" stroke="#2c3785" stroke-width="4"/>
  <line x1="842" y1="210" x2="842" y2="310" stroke="#2c3785" stroke-width="7"/><circle cx="823" cy="260" r="8" fill="none" stroke="#2c3785" stroke-width="4"/>
  <rect x="20" y="170" width="170" height="180" fill="none" stroke="#2c3785" stroke-width="2" opacity=".3"/>
  <rect x="730" y="170" width="170" height="180" fill="none" stroke="#2c3785" stroke-width="2" opacity=".3"/>
  <path d="M245 72 A225 225 0 0 1 245 448" fill="none" stroke="#2c3785" stroke-width="3" opacity=".13"/>
  <path d="M675 72 A225 225 0 0 0 675 448" fill="none" stroke="#2c3785" stroke-width="3" opacity=".13"/>
  <g id="halfLabel" opacity="0"><rect x="346" y="35" width="228" height="36" rx="7" fill="#fad606"/><text x="460" y="59" text-anchor="middle" fill="#2c3785" font-size="14" font-weight="900">DEFENSE RETREATS HERE</text></g>
  <g id="inboundLabel"><text x="870" y="340" text-anchor="middle" fill="#2c3785" font-size="13" font-weight="900">INBOUND</text><path d="M850 348 L875 368" stroke="#2c3785" stroke-width="3"/></g>
  <g id="people"></g><circle id="ball" r="10" fill="#fad606" stroke="#2c3785" stroke-width="3"/>
 </svg>
 </div>
 <div class="watch"><b>WHAT THE OFFICIAL SHOULD WATCH</b><div id="watch"></div></div>
</div>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg',g=document.getElementById('people'),ball=document.getElementById('ball'),
ttl=document.getElementById('ttl'),desc=document.getElementById('desc'),watch=document.getElementById('watch'),
bt=document.getElementById('bt'),bx=document.getElementById('bx'),halfLabel=document.getElementById('halfLabel'),
inboundLabel=document.getElementById('inboundLabel'),midline=document.getElementById('midline'),
play=document.getElementById('play'),tabs=[...document.querySelectorAll('.tab')];
let scene='press',nodes=[],raf=null,running=false;
function mk(team,i){const q=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle'),t=document.createElementNS(NS,'text');
 c.setAttribute('r',18);c.setAttribute('fill',team==='O'?'#fad606':'#2c3785');c.setAttribute('stroke','#2c3785');c.setAttribute('stroke-width',3);
 t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('font-size',13);t.setAttribute('font-weight',900);
 t.setAttribute('fill',team==='O'?'#2c3785':'white');t.textContent=team;q.append(c,t);g.append(q);nodes.push({q,team,i});}
for(let i=0;i<5;i++)mk('O',i);for(let i=0;i<5;i++)mk('D',i);

const S={
 press:{
  title:'Full-Court Pressure Is Allowed at All Times',
  desc:'In 5th/6th grade, the defense may pressure anywhere on the court — including immediately on an inbound after a made basket or dead ball.',
  watch:'There is no normal retreat restriction in 5th/6th grade. Defenders may pressure the inbound, deny passes and guard the ball in the backcourt. The 20-point lead rule is the exception.',
  btitle:'LEGAL — FULL-COURT PRESSURE',
  btext:'Defense may pressure immediately, including on a dead-ball inbound.',
  dur:4200,
  O0:[[875,270],[815,215],[800,330],[735,175],[730,395]],
  O1:[[875,270],[665,225],[655,340],[590,175],[585,395]],
  D0:[[835,215],[790,330],[720,220],[700,365],[640,285]],
  D1:[[660,210],[620,330],[565,220],[550,365],[505,285]],
  B0:[875,292],B1:[670,245]
 },
 twenty:{
  title:'Leading by 20 or More',
  desc:'The normal full-court-pressure rule changes when a 5th/6th-grade team leads by 20 or more.',
  watch:'When the leading team is up 20+, its defense must stay behind half court until the ball crosses half court. If the lead drops below 20, normal full-court pressure is allowed again.',
  btitle:'20+ LEAD — RETREAT BEHIND HALF COURT',
  btext:'The leading defense may not apply backcourt pressure.',
  dur:4500,
  O0:[[835,260],[875,335],[250,145],[245,390],[315,265]],
  O1:[[425,260],[505,330],[250,145],[245,390],[315,265]],
  D0:[[390,255],[330,360],[255,205],[270,435],[395,330]],
  D1:[[400,255],[330,360],[255,205],[270,435],[395,330]],
  B0:[835,280],B1:[425,280],guardStart:.78
 }
};
function xy(q,p){q.setAttribute('transform',`translate(${p[0]} ${p[1]})`)}
function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function stop(){cancelAnimationFrame(raf);running=false;play.textContent='▶ Play'}
function setup(){
 const s=S[scene];nodes.forEach(n=>xy(n.q,(n.team==='O'?s.O0:s.D0)[n.i]));
 ball.setAttribute('cx',s.B0[0]);ball.setAttribute('cy',s.B0[1]);ttl.textContent=s.title;desc.textContent=s.desc;watch.textContent=s.watch;bt.textContent=s.btitle;bx.textContent=s.btext;
 halfLabel.setAttribute('opacity',scene==='twenty'?1:0);inboundLabel.setAttribute('opacity',scene==='press'?1:0);
 midline.setAttribute('stroke',scene==='twenty'?'#fad606':'#2c3785');midline.setAttribute('stroke-width',scene==='twenty'?8:4);
}
function run(){
 stop();setup();running=true;play.textContent='⏸ Pause';const s=S[scene],st=performance.now();
 function frame(now){
  const t=Math.min(1,(now-st)/s.dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  nodes.forEach(n=>{const a=(n.team==='O'?s.O0:s.D0)[n.i],b=(n.team==='O'?s.O1:s.D1)[n.i];let use=e;
   if(scene==='twenty'&&n.team==='D'){use=n.i===0?(t<s.guardStart?0:(t-s.guardStart)/(1-s.guardStart)):0;}
   xy(n.q,lerp(a,b,Math.max(0,Math.min(1,use))));
  });
  const p=lerp(s.B0,s.B1,e);ball.setAttribute('cx',p[0]);ball.setAttribute('cy',p[1]);
  if(t<1&&running)raf=requestAnimationFrame(frame);else{running=false;play.textContent='▶ Play'}
 }
 raf=requestAnimationFrame(frame);
}
function choose(s){stop();scene=s;tabs.forEach(b=>b.classList.toggle('active',b.dataset.s===s));setup()}
tabs.forEach(b=>b.onclick=()=>choose(b.dataset.s));play.onclick=()=>running?stop():run();document.getElementById('reset').onclick=()=>{stop();setup()};setup();
})();
</script>
</body></html>
